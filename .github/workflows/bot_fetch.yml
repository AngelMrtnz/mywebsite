name: Update arXiv Papers

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight (UTC)
  workflow_dispatch: # Run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch and merge arXiv feed
        run: node .github/scripts/merge_arxiv.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/papers.xml
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update arXiv papers"
          git push
